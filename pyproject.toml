[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
extend-select = ["W", "E4", "E7", "E9", "TID", "PT", "ANN", "T20"]

[tool.ruff.lint.per-file-ignores]
# Off-ratchet directories: held to pyflakes and the correctness rules, not to
# the annotation and robustness rules the production layers opted into.
#
# `ANN`/`T20` are the two groups this project selected for production code, and
# neither earns its keep below: these are standalone tools and dead-or-parked
# code, where a `print` *is* the interface and an annotation buys nothing
# because nothing type-checks against them either (see the matching `ignore`
# list under [tool.pyright]). `BLE001`/`S110` go with them because a tool that
# must not die mid-session legitimately catches broadly and reports, which is a
# different trade from the engine's. Everything pyflakes reports - unused
# variables and imports, undefined names - still applies here and is still
# fixed, as are stray `breakpoint()` calls.
#
# See docs/agents/typing.md -> Off-ratchet directories.
"ml_training/**" = [
    "T20", "ANN", "TID252", "BLE001", "S110", "B019", "B026", "PIE796",
    "DTZ", "E402",
]
"toolkit/**" = [
    "T20", "ANN", "TID252", "BLE001", "S110", "B019", "B026", "PIE796",
    "DTZ", "E402",
]
"scripts/**" = [
    "T20", "ANN", "TID252", "BLE001", "S110", "B019", "B026", "PIE796",
    "DTZ", "E402",
]
# The GUI map editor: an authoring tool run by hand, whose `print`s are its UI.
"maple/model/mechanics/minimap_creation/**" = [
    "T20", "ANN", "TID252", "BLE001", "S110", "B019", "B026", "PIE796",
    "DTZ", "E402",
]
# The older game-file parser. `map_parser.py` has no importers and is slated for
# removal (maple/AGENTS.md); annotating it is work spent on code on its way out.
"maple/model/mechanics/game_file_extraction/**" = [
    "T20", "ANN", "TID252", "BLE001", "S110", "B019", "B026", "PIE796",
    "DTZ", "E402",
]
# `BotData` is a dynamically-typed attribute store: a managed attribute holds
# whatever the DecisionMaker that registered it puts there, so `Any` at this
# module's interface is the accurate type rather than a lazy one, and narrowing
# it would only push casts out to every caller. ANN401 alone - every other rule,
# including the rest of ANN, still applies to this file.
"botting/core/bot_data.py" = ["ANN401"]
# Parked, and raises on import. maple/AGENTS.md: "When lint and type gates land,
# exclude this file explicitly rather than editing it into compliance."
"maple/decision_makers/inventory_manager.py" = [
    "T20", "ANN", "TID252", "BLE001", "S110", "B019", "B026", "PIE796",
    "DTZ", "E402",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.TestCase".msg = "Use pytest: module-level test_* functions and bare assert. See docs/agents/testing.md."
"unittest.IsolatedAsyncioTestCase".msg = "Use pytest with pytest-asyncio. See docs/agents/testing.md."
"unittest.main".msg = "Tests run under pytest. See docs/agents/testing.md."

[tool.pyright]
include = ["botting", "maple", "ml_training", "tests", "toolkit", "conftest.py", "paths.py"]
typeCheckingMode = "standard"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
strict = ["botting/controller/inputs"]
# The other end of the ratchet from `strict`: directories that report nothing.
# `ignore` rather than `exclude` on purpose - these files are still parsed, so
# code that *is* on the ratchet still gets real types when it imports them.
# Same list as the ANN per-file-ignores above, and the same reasoning: tools,
# dead code, and one parked module. See docs/agents/typing.md.
ignore = [
  "ml_training",
  "toolkit",
  "scripts",
  "maple/model/mechanics/minimap_creation",
  "maple/model/mechanics/game_file_extraction",
  "maple/decision_makers/inventory_manager.py",
]
reportMissingTypeStubs = "none"
reportUnusedImport = "none"
reportUndefinedVariable = "none"
