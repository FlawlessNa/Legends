; Copy this file to `configs/keybindings.ini` and add one section per character
; you bot with. `configs/keybindings.ini` is gitignored -- your binds are yours.
;
; RULES
;   * The section name MUST be the character's exact in-game name (IGN). The
;     launcher profile's `ign` is looked up here verbatim.
;   * Values are Python dict literals -- they are read with `eval()`, so the
;     quoting and trailing commas below matter. Indent continuation lines.
;   * Skill Keys names MUST match the skill names defined for your character's
;     class in maple/model/characters/ (e.g. magicians.py, thiefs.py). A typo
;     surfaces as a KeyError at runtime, not at startup.
;   * These must mirror your ACTUAL in-game key layout. The bot presses keys, it
;     does not read the game's own bindings. If you rebind in game, edit here too.
;   * `;` starts a comment; you can comment out a line inside a dict to disable
;     that bind (see 'Speed Pill' below).
;
; The example below is a Bishop. Replace the whole section for your own class.

[YourCharacterName]
Non Skill Keys = {
                 'jump': 'alt_right',
                 'Pet Food': 'u',
                 'Ability Menu': 't',
                 'Inventory Menu': 'i',
                 'Minimap Toggle': 'm',
                ;  'Speed Pill': '0',
                 'NPC Chat': 'n',
                 'Chat Toggle':"'",
                 }
Skill Keys = {
             'Magic Claw': 's',
             'Magic Guard': 'insert',
             'Bless': 'pagedown',
             'Invincible': 'home',
             'Teleport': 'c',
             'Heal': 'space',
             'Holy Symbol': 'pageup',
             'Shining Ray': 'a',
             'Genesis': 'v',
             'Maple Warrior': 'home',
             'Mystic Door': '9',
             }

; Position of the item in the in-game quick slots layout, which is assumed to be:
; [1, 2, 3, 4]
; [5, 6, 7, 8]
Quick slots = {
            'hp_potions': 1,
            'mp_potions': 6,
             'pet_food': 3,
            }

; A second character -- one section per IGN, all loaded from the same file.
; [YourMuleName]
; Non Skill Keys = {...}
; Skill Keys = {...}
; Quick slots = {...}
