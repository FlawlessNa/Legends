; Copy this file to `configs/game_data.ini` and set the path to this machine's
; client. `configs/game_data.ini` is gitignored -- the path is machine-specific.
;
; `Data` is the MapleStory Classic client's data folder: the `Data` inside
; `MSCW`, not the modern client's `MapleStory\Data` beside it. `game_data`
; reads only these files, and never touches the running game. A path passed on
; the command line (`--client`) overrides this one.

[Client]
Data = C:\Program Files (x86)\Steam\steamapps\common\MapleStory\MSCW\Data
