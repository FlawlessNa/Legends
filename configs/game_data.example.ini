; Copy this file to `configs/game_data.ini` and set the path to this machine's
; client. `configs/game_data.ini` is gitignored -- the paths are machine-specific.
; A ticket worktree gets a copy of it (docs/agents/orchestrating.md).
;
; `Data` is the MapleStory Classic client's data folder: the `Data` inside
; `MSCW`, not the modern client's `MapleStory\Data` beside it. `game_data`
; reads only these files, and never touches the running game. A path passed on
; the command line (`--client`) overrides this one.

[Client]
Data = C:\Program Files (x86)\Steam\steamapps\common\MapleStory\MSCW\Data

; Optional. `Root` is the game data store: where `python -m game_data extract`
; writes, and what everything reads. Left out, it is `data/game_data` in this
; checkout. A worktree sets it to the main checkout's store to use it in place,
; with no copy: each catalogue schema version has its own file there, so
; branches at different versions share it safely. A relative path is taken
; from the repo root. A path passed on the command line (`--root`) overrides it.
;
; [Store]
; Root = C:\path\to\Legends\data\game_data

; Optional. `Root` is where `scripts/fetch_frames.py` puts the frame sets, and
; where the `frames` tests read them. Left out, it is `data/frames`.
;
; [Frames]
; Root = C:\path\to\Legends\data\frames
