; Copy this file to `configs/discord.ini` and fill in your own values.
; `configs/discord.ini` is gitignored -- never commit your token.
;
; Every user runs their OWN Discord bot. Create one at
; https://discord.com/developers/applications:
;   1. New Application -> Bot -> Reset Token, copy the token below.
;   2. Under Bot, enable all three Privileged Gateway Intents
;      (the client requests discord.Intents.all()).
;   3. OAuth2 -> URL Generator -> scopes `bot`, permissions
;      Read Messages/View Channels, Send Messages, Attach Files.
;      Open the generated URL to invite the bot to your server.
;
; See docs/SETUP.md for the full walkthrough.

[DEFAULT]
; Which [User N] section below is active for this machine.
User = 1
DISCORD_TOKEN = paste-your-bot-token-here

[User 1]
; Your Discord account name -- the bot only accepts commands from this user.
DISCORD_USERNAME = your-discord-username
; Your Discord user ID. Enable Developer Mode in Discord
; (Settings -> Advanced), then right-click your name -> Copy User ID.
DISCORD_ID = 000000000000000000
; Name of the text channel the bot reports to. The bot must be able to see it.
DISCORD_CHANNEL = your-channel-name
