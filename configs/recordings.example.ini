; Copy this file to `configs/recordings.ini` and adjust the folder path.
; `configs/recordings.ini` is gitignored -- the path is machine-specific.
;
; The screen recorder writes one video per Session. Point `Recordings Folder`
; at a drive with room to spare; the folder manager prunes oldest-first once
; the folder exceeds `Max Recordings Folder Size (GB)`.

[DEFAULT]
Recordings Folder = C:\Users\YourName\Videos\LegendsRecordings

FPS = 8
Multiplier = 3
Four CC = XVID
File Extension = .avi

Max Recordings Folder Size (GB) = 50
