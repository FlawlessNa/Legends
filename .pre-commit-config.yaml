repos:
  # language: system hooks call straight into the pinned .venv, so the hook
  # version always matches what `pip install -r requirements-dev.txt` gave you
  # -- no second, drifting copy from a hook-managed environment.
  #
  # They go through scripts/venv-tool.sh rather than naming .venv directly: a
  # linked worktree has no .venv of its own, and these entries silently failed
  # there with "Executable not found" (#199). The resolver walks to the main
  # checkout, and exits non-zero when it finds nothing -- a commit that quietly
  # skips ruff and pyright is worse than one that stops.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash scripts/venv-tool.sh ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: bash scripts/venv-tool.sh ruff format
        language: system
        types: [python]

      - id: pyright
        name: pyright
        entry: bash scripts/venv-tool.sh pyright
        language: system
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
