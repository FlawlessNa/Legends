# The auto-merge policy, run by CI so that no agent decides what merges.
#
# docs/factory/merge-policy.md states the policy and factory/merge.py holds it.
# This file carries no condition of its own: it finds the PR, runs
# `factory merge check` from the PR's BASE branch, and merges on exit 0.
#
# GitHub runs pull_request_target and workflow_run from the DEFAULT branch's
# copy of this file, so it does nothing until it reaches that branch. It never
# checks out or executes the PR's head, and event fields reach scripts through
# env: only -- a write token and a stranger's PR body must never share a shell.
#
# Off switch: `gh workflow disable "Merge policy"`.

name: Merge policy

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  # #151's checks finish after the PR events above; re-evaluate when they do.
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to evaluate
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: read
  checks: read

concurrency:
  group: merge-policy-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: merge-policy
    runs-on: ubuntu-latest
    steps:
      - name: Find the pull request and its base
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          pr="${EVENT_PR:-${RUN_PR:-$INPUT_PR}}"
          if ! [[ "$pr" =~ ^[0-9]+$ ]]; then
            echo "No pull request to evaluate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base="$(gh pr view "$pr" --json baseRefName --jq .baseRefName)"
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Check out the base branch, never the pull request
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base }}
          persist-credentials: false

      - name: Set up Python
        if: steps.pr.outputs.number != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Evaluate the policy
        id: verdict
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          if [ ! -f factory/merge.py ]; then
            echo "PR #$PR: its base branch carries no merge policy. Waiting for a human." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pip install --quiet -e . --no-deps
          set +e
          factory --json merge check "$PR" > verdict.json
          code=$?
          set -e
          cat verdict.json
          {
            echo "## Merge policy: PR #$PR, exit $code"
            echo
            echo '```json'
            cat verdict.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Waiting passes the job; a policy that could not run fails it, so a
          # broken gatherer is seen rather than making every PR wait silently.
          if [ "$code" = 2 ] || [ "$(jq -r '.readable' verdict.json 2>/dev/null)" != "true" ]; then
            echo "::error::The merge policy could not evaluate PR #$PR."
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .head_sha verdict.json)" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r .base verdict.json)" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: steps.verdict.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD: ${{ steps.verdict.outputs.head }}
          BASE: ${{ steps.verdict.outputs.base }}
        run: |
          # Re-read immediately before merging: a retargeted base or a new push
          # since evaluation means the verdict was about a different PR.
          now="$(gh pr view "$PR" --json baseRefName,headRefOid --jq '.baseRefName + " " + .headRefOid')"
          if [ "$now" != "$BASE $HEAD" ]; then
            echo "PR #$PR moved after evaluation ($now). Not merging." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr merge "$PR" --merge --match-head-commit "$HEAD"
          echo "PR #$PR merged at $HEAD by the merge policy." >> "$GITHUB_STEP_SUMMARY"
