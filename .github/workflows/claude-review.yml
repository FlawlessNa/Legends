# Claude reviews every ticket PR into an epic branch, and merges it on
# approval (#244, D5). PRs into dev are never touched: dev is the
# maintainer's.
#
# The review runs on the maintainer's Claude subscription
# (CLAUDE_CODE_OAUTH_TOKEN, the main account, set with `claude setup-token`),
# so each run draws on the same usage limits as interactive sessions.
#
# Fallback account (#447): CLAUDE_CODE_OAUTH_TOKEN_FALLBACK is optional. The
# review runs on the main token first. Only when that attempt produces no
# structured_output (for example the main account is out of usage) does a
# second attempt run on the fallback token. A verdict from the main attempt,
# approve or request-changes, means the fallback never runs. With the fallback
# secret unset there is one attempt, which fails with no verdict. The gate step
# logs which account judged. To set it: run `claude setup-token` while signed
# in to the second account, then `gh secret set CLAUDE_CODE_OAUTH_TOKEN_FALLBACK`.
#
# It runs on `pull_request_target`, so GitHub takes this file from the DEFAULT
# branch (dev), and the job checks out dev for the review's rules
# (docs/agents/code-review.md, tickets.md). Neither a PR nor an epic branch
# can change the workflow or the rules that judge it: only the maintainer's
# merges into dev can. No PR code is checked out or executed: Claude reads the
# change through `gh pr diff`. A change to this file therefore takes effect
# only once it is merged into dev.
#
# The `review` job fails unless Claude approves. The `epic/**` ruleset requires
# it as a status check, and the `merge` job runs only after it passes. The
# ruleset also requires `gates` (ci.yml), which runs on its own clock, so
# `merge` waits for `gates` on the reviewed commit before merging (#414). This
# workflow is the only actor that merges into an epic branch; no agent does.
#
# Merge method (#453): a PR is squash-merged, unless any commit in it has more
# than one parent (it brings dev in). Then it is merge-committed, so the epic
# keeps dev's history and its later PR into dev does not see dev's work as
# unmerged. The rule is read from the PR's commits through the API.
#
# Off switch: `gh workflow disable "Claude review"`.

name: Claude review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["epic/**"]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Same-repo PRs only: a fork's PR never gets the token.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Secrets cannot be tested in a step `if`, so expose only whether the
      # fallback is set. The token itself is never echoed.
      HAS_FALLBACK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK != '' }}
      # The review's rules, defined once so both accounts judge by the same text.
      REVIEW_PROMPT: |
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}

          You are reviewing a ticket PR into an epic branch. The working
          directory holds the default branch, not the PR: read the change
          only through `gh pr diff` and `gh pr view`, and read the repo's
          rules from the working directory.

          1. Read docs/agents/code-review.md and follow it.
          2. Read the PR (`gh pr view`, `gh pr diff`). Its body names the ticket
             it implements; read that ticket with `gh issue view`, then the
             epic the ticket is "Part of": read the epic's intent in full, and
             the spec sections the ticket names.
          3. Judge the diff against:
             - the ticket's acceptance criteria, one by one;
             - the ticket's `## Constraints`, one by one: each holds, or is
               broken (with file and line). A broken constraint is blocking
               even when every acceptance criterion is met;
             - the epic's intent, since correct but unwanted work is a finding;
             - docs/agents/tickets.md, "What you may change". A change to an
               area listed under "not without asking" is blocking unless the
               ticket explicitly covers it;
             - the PR body's "Could not verify" list, against the risk of the
               diff.
          4. Post exactly one top-level comment with `gh pr comment`. Start it
             with the verdict, then tick each of the ticket's constraints
             (holds / broken), then list each finding with its file and line,
             marking each one blocking or non-blocking.
          5. Return `approve` only if no finding is blocking. Otherwise return
             `request-changes`. An approval merges the PR into the epic branch.
      REVIEW_ARGS: |
          --model opus
          --max-turns 40
          --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
          --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","request-changes"]},"summary":{"type":"string"}},"required":["verdict","summary"]}'
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # continue-on-error: an account out of usage ends this step with no
      # structured_output; the fallback step below then takes over.
      - name: Review (main account)
        id: review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: ${{ env.REVIEW_ARGS }}

      # Only when the main attempt produced no verdict and the fallback secret
      # is set. Same prompt and arguments as the main attempt (REVIEW_PROMPT, REVIEW_ARGS).
      - name: Review (fallback account)
        id: review_fallback
        if: steps.review.outputs.structured_output == '' && env.HAS_FALLBACK == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: ${{ env.REVIEW_ARGS }}

      - name: Gate on the verdict
        env:
          MAIN_RESULT: ${{ steps.review.outputs.structured_output }}
          FALLBACK_RESULT: ${{ steps.review_fallback.outputs.structured_output }}
        run: |
          if [ -n "$MAIN_RESULT" ]; then
            account=main
            RESULT="$MAIN_RESULT"
          elif [ -n "$FALLBACK_RESULT" ]; then
            account=fallback
            RESULT="$FALLBACK_RESULT"
          else
            account=none
            RESULT=""
          fi
          verdict="$(jq -r '.verdict // empty' <<<"$RESULT")"
          echo "Judged by the $account account. Claude's verdict: ${verdict:-none}"
          echo "$RESULT" | jq -r '.summary // empty'
          test "$verdict" = "approve"

  merge:
    needs: review
    runs-on: ubuntu-latest
    # gates (ci.yml) has a 30-minute timeout of its own, plus queue time.
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      checks: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # The ruleset also requires `gates`, which CI runs on its own clock and
      # often finishes after the review. Wait for it on the reviewed commit.
      # If it never reports (CI does not run on a PR with a merge conflict),
      # give up after 40 minutes; the PR stays open for a re-run or a person.
      - name: Wait for gates
        run: |
          deadline=$((SECONDS + 40 * 60))
          while :; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=gates&filter=latest" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last
                    | if . == null then "missing" elif .status != "completed" then .status else .conclusion end')"
            echo "gates on ${HEAD_SHA:0:8}: $state"
            case "$state" in
              success) exit 0 ;;
              missing|queued|in_progress|waiting|pending|requested) ;;
              *) echo "::error::gates is $state; not merging."; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::gates did not pass within 40 minutes ($state); not merging. Re-run this job once it has."
              exit 1
            fi
            sleep 20
          done

      - name: Merge into the epic branch
        # --match-head-commit: merge exactly what was reviewed, never a commit
        # pushed after the review started. gh refuses client-side while GitHub
        # still reports the PR BLOCKED, which can lag a just-finished check,
        # so retry for a few minutes; the state line goes to the log.
        # The method is decided from the PR's commits (API only, no checkout):
        # any commit with more than one parent means --merge, else --squash.
        run: |
          merge_commits="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" \
            --jq '.[] | select((.parents | length) > 1) | .sha')"
          if [ -n "$merge_commits" ]; then
            method="--merge"
            echo "Merge method: merge commit, because the PR contains merge commit(s): $(echo "$merge_commits" | cut -c1-8 | paste -sd, -)"
          else
            method="--squash"
            echo "Merge method: squash, because no commit in the PR is a merge commit"
          fi
          for attempt in 1 2 3 4 5 6; do
            gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeStateStatus,mergeable,statusCheckRollup \
              --jq '"mergeStateStatus=\(.mergeStateStatus) mergeable=\(.mergeable) checks=\([.statusCheckRollup[] | "\(.name // .context):\(.conclusion // .state // .status)"] | join(","))"'
            if gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" "$method" --delete-branch --match-head-commit "$HEAD_SHA"; then
              exit 0
            fi
            sleep 30
          done
          exit 1
