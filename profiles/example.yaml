# ============================================================================
# Launcher profile -- copy this file, don't edit it in place.
#
#     copy profiles\example.yaml profiles\farmacy.yaml
#     python -m maple.launchers.run farmacy
#
# Everything under profiles/ except this template is gitignored, so your setup
# stays yours and nobody has to resolve merge conflicts over a character name.
# ============================================================================

# Your character's exact in-game name. It names your keys' section, so it must
# match the section name in configs/keybindings.ini exactly. The game window is
# found by configs/game.ini [Client], not by this name.
ign: YourCharacterName

# Which bot to run. Accepts the class name from maple/bots/__init__.py or its
# "Bot"-less shorthand, so `training` and `TrainingBot` are the same thing.
# Run `python -m maple.launchers.run --list` to see your profiles; an unknown
# bot name here prints the list of what is actually exported.
# A throwaway bot that is not exported can be named as `module.path:ClassName`
# (case-sensitive), e.g. `scratch.my_bot:MyBot`. The module must be importable
# from where you launch, and the class must subclass MapleBot. `scratch/` is
# gitignored.
bot: training

# Everything below is passed straight to the bot's constructor. Anything the
# bot accepts is valid here, whether or not it is shown in this template.
settings:
  # -- Map ------------------------------------------------------------------
  # `map` is the game's name for the map (`street: map name` when several maps
  # share a name), or its map id. An ambiguous name refuses to start and lists
  # the ids it matched. `auto` is not available yet (map identification, #387).
  #
  # `game_map` is required alongside it until the map files are retired (#399):
  # the old map loading needs a file in configs/maps/, without the .json
  # extension. A `map` without `game_map` refuses to start, and so does a map
  # file whose own `map_id` names another map than `map`. Keep the two on the
  # same map. (Check the name against your client: `python -m game_data`.)
  map: "Subway: Line 1 Area 1"
  game_map: Line1Area1

  # -- Detection model ------------------------------------------------------
  # Maps a mob class to the directory holding its weights. "All" means one
  # model handles every class. Paths are relative to the repo root and must
  # contain weights/best.pt -- run `python scripts/fetch_models.py` to get them.
  # See models.manifest.json for what each model detects. A model trained
  # from a recipe (`synth`) has it there too, and fetching writes it back to
  # recipe.json beside the weights.
  models_path:
    All: data/models/production/global

  # How your character is located on screen. Names a section in
  # configs/character_detection.ini. Omit to use the default detection.
  # detection_configs: Elephant Cape

  # Client window size: "large" or "medium". Must match the game client's
  # actual size -- see configs/game.ini.
  client_size: large

  # Required: your character's job. It is no longer read from the screen.
  # One of the keys in maple/model/characters/__init__.py
  # (Magician, Cleric, Priest, Bishop, Rogue, Assassin, Hermit, ...).
  character_class: Bishop

  # -- Combat ---------------------------------------------------------------
  # The attack used on rotation. Must be a skill your class has AND a key you
  # bound in configs/keybindings.ini.
  training_skill: Genesis

  # Minimum mobs on screen before the training skill is worth casting.
  mob_count_threshold: 8

  # Buffs the bot keeps up on itself. Each must be bound in keybindings.ini.
  included_buffs:
    - Maple Warrior
    - Holy Symbol

  # -- Upkeep ---------------------------------------------------------------
  # Number of pets to feed. 0 disables pet food entirely.
  num_pets: 1

  # -- Failsafes ------------------------------------------------------------
  # Warn over Discord when fewer than `threshold` mobs have spawned for
  # `timer` seconds -- an anti-detection measure.
  mob_spawn_alert_timer: 15
  mob_spawn_alert_threshold: 4

  # -- Movement tuning ------------------------------------------------------
  # Leave these out unless movement is visibly mistimed. Speed and jump
  # multipliers correct for gear/buffs the physics model doesn't know about;
  # measure them in the map editor (`python toolkit/create_map.py --map
  # <MapName> --ign <YourIGN>`) rather than guessing.
  # speed_multiplier: 1.4
  # jump_multiplier: 1.23
  # Calibration constants: multipliers on the game-file physics, set from
  # what Trials measure (CONTEXT.md -> Calibration constant). Each is 1.0
  # when left out. Not read yet: movement moves to virtual px in #396.
  # calibration:
  #   walk: 1.0
  #   jump: 1.0
  #   climb: 1.0
  #   teleport: 1.0

  # Smart rotation picks targets from live mob positions instead of walking a
  # fixed route. Off by default -- it is the less-tested path.
  smart_rotation_enabled: false

  # Teleport is used for movement where available. Set true for classes where
  # it misbehaves.
  # disable_teleport: true
