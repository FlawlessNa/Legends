# ============================================================================
# Launcher profile -- copy this file, don't edit it in place.
#
#     copy profiles\example.yaml profiles\farmacy.yaml
#     python -m maple.launchers.run farmacy
#
# Everything under profiles/ except this template is gitignored, so your setup
# stays yours and nobody has to resolve merge conflicts over a character name.
# ============================================================================

# Your character's exact in-game name. It names your keys' section, so it must
# match the section name in configs/keybindings.ini exactly. The game window is
# found by configs/game.ini [Client], not by this name.
ign: YourCharacterName

# Which bot to run. Accepts the class name from maple/bots/__init__.py or its
# "Bot"-less shorthand, so `training` and `TrainingBot` are the same thing.
# Run `python -m maple.launchers.run --list` to see your profiles; an unknown
# bot name here prints the list of what is actually exported.
# A throwaway bot that is not exported can be named as `module.path:ClassName`
# (case-sensitive), e.g. `scratch.my_bot:MyBot`. The module must be importable
# from where you launch, and the class must subclass MapleBot. `scratch/` is
# gitignored.
bot: training

# Everything below is passed straight to the bot's constructor. Anything the
# bot accepts is valid here, whether or not it is shown in this template.
settings:
  # -- Map ------------------------------------------------------------------
  # `map` is the game's name for the map (`street: map name` when several maps
  # share a name), or its map id. An ambiguous name refuses to start and lists
  # the ids it matched.
  #
  # At start the bot checks the minimap: it refuses to start when the minimap
  # shows another map, or when it can't tell within 3 s. `auto` identifies the
  # map instead, from the minimap's banner (its title) confirmed by the map's
  # minimap; it needs the `minimap-title` glyphs (`python -m
  # toolkit.harvest_glyphs`) and reads only titles made of letters harvested so
  # far. Either way the bot may press the minimap key to show the minimap
  # expanded (with its banner, for `auto`).
  #
  # The map comes from the client's files (`python -m game_data extract`), so
  # there is no map file: find the name with `python -m game_data search
  # <part of it> --kind map`. `game_map`, the retired map file's name, refuses
  # to start (#399).
  #
  # The mobs the bot looks for are the map's, from its spawns in the game
  # files: there is no `mobs` setting, and one refuses to start (#548). The
  # bot refuses to start when no model in `models_path` below detects a mob
  # the map has, and names the mobs it misses. Ellinia is a town, with no
  # mobs: the bot would never cast there. Of the shipped models' mobs, the
  # MSCW client has only Bubbling: "Kerning City Subway: Line 1 <Area 1>"
  # spawns it, and nothing else.
  map: "Victoria Road: Ellinia"

  # -- Detection model ------------------------------------------------------
  # Maps a mob class to the directory holding its weights. "All" means one
  # model handles every class no other key names. A mob's class is its game
  # name without spaces and dots (`Selkie Jr.` is `SelkieJr`). Paths are
  # relative to the repo root and must contain weights/best.pt -- run
  # `python scripts/fetch_models.py` to get them.
  # See models.manifest.json for what each model detects. A model trained
  # from a recipe (`synth`) has it there too, and fetching writes it back to
  # recipe.json beside the weights.
  models_path:
    All: data/models/production/global

  # How your character is located on screen. Names a section in
  # configs/character_detection.ini. Omit to use the default detection.
  # detection_configs: Elephant Cape

  # Client window size: "large" or "medium". Must match the game client's
  # actual size -- see configs/game.ini.
  client_size: large

  # Required: your character's job, as the client names it, case aside:
  # Swordsman, Fighter, Crusader, Hero, Page, WhiteKnight, Paladin, Spearman,
  # DragonKnight, DarkKnight, Magician, Cleric, Priest, Bishop, Rogue, Assassin,
  # Hermit, Bandit, ChiefBandit, Shadower... (JOB_IDS in
  # maple/model/characters/jobs.py has them all). It is not read from the screen.
  # A skill's name is looked up in this job's line only.
  character_class: Bishop

  # -- Combat ---------------------------------------------------------------
  # The skills come from the client's files: you set up no range, timing or
  # duration. Every skill named below must be in your `Skill Keys`
  # (configs/keybindings.ini) under the client's own name; find it with
  # `python -m game_data search <name> --kind skill`. A name your job's line
  # doesn't have refuses the start, and names the closest.
  #
  # `attacks`: in order, each skill and how many mobs must be in its reach for it
  # to be cast. The first one that would fire is cast, and the rotation goes where
  # the earliest one fires. Put the multi-mob attack first. A swordsman:
  #   attacks:
  #     - skill: Slash Blast
  #       min_mobs: 3
  #     - skill: Power Strike
  #       min_mobs: 1
  # A power strike or a slash blast plays the weapon's swings, so the weapon is
  # read in game at launch (the `Equipment Menu` key opens the window). A skill
  # with no reach (Magic Claw, or a bow's or wand's attack) refuses the start.
  attacks:
    - skill: Genesis
      min_mobs: 8

  # Which way a one-sided attack faces when mobs are on both sides. `closest`
  # faces the nearest mob, `most` the side with more mobs in reach. A two-sided
  # attack (Heal, for one) never faces. Default: closest.
  # facing: closest

  # Buffs the bot keeps up on itself: skill names, each in your `Skill Keys`.
  # None is kept up by default, so list every one.
  buffs:
    - Maple Warrior
    - Holy Symbol

  # A skill is at the level given here, and at its maximum level when left out,
  # until the skill window is read in game (#630). The launch warns about each
  # skill whose reach, mobs hit or duration changes with its level and that has
  # no level here: a buff below its maximum level is down for part of each cycle.
  # skill_levels:
  #   Slash Blast: 8
  #   Iron Body: 5

  # RETIRED -- each refuses the start and names its replacement:
  #   training_skill       -> attacks
  #   mob_count_threshold  -> the `min_mobs` of each attack in `attacks`
  #   included_buffs       -> buffs
  #   excluded_buffs       -> buffs (list only what you want kept up)

  # -- Upkeep ---------------------------------------------------------------
  # Number of pets to feed. 0 disables pet food entirely.
  num_pets: 1

  # -- Failsafes ------------------------------------------------------------
  # Warn over Discord when fewer than `threshold` mobs have spawned for
  # `timer` seconds -- an anti-detection measure.
  mob_spawn_alert_timer: 15
  mob_spawn_alert_threshold: 4

  # -- Chat replies ---------------------------------------------------------
  # The character answers players who talk to it, through Claude Haiku 5.5,
  # with the instructions in configs/chat_replies/. On by default: the bot
  # refuses to start when the instructions don't load or the model can't be
  # reached (set ANTHROPIC_API_KEY, or `ant auth login`). `false` turns the
  # replies off; the GM alarm still runs. From Discord, `REPLIES OFF|ON`
  # pauses and hands them back for a session.
  # chat_replies: false

  # -- Movement tuning ------------------------------------------------------
  # Leave these out unless movement is visibly mistimed. Speed and jump
  # multipliers are the character's speed and jump stats (the ability window
  # shows them), which the game-file physics are multiplied by.
  # speed_multiplier: 1.4
  # jump_multiplier: 1.23
  # Calibration constants: multipliers on the game-file physics, set from
  # what Trials measure (CONTEXT.md -> Calibration constant). Each is 1.0
  # when left out. Movement Plans read them (#396).
  # calibration:
  #   walk: 1.0
  #   jump: 1.0
  #   climb: 1.0
  #   teleport: 1.0

  # Where the character heads to hunt. random: random points on the map's
  # Platforms. smart: towards the mobs on screen (the less-tested path).
  # hunting_area: towards the mobs inside one rectangle of the map, leaving the
  # rest to other players; with no `hunting_area` below, the launch window asks
  # you to draw it. Left out, it is random.
  rotation: random
  # A saved area of this map, in configs/hunting_areas/<map id>.json. Only with
  # `rotation: hunting_area`.
  # rotation: hunting_area
  # hunting_area: right_corner

  # Teleport is used for movement where available. Set true for classes where
  # it misbehaves.
  # disable_teleport: true
