<!-- Paste before </main> once the intent is agreed and the threshold is crossed. -->
<section data-block="s-spec" class="space-y-3">
  <h2 class="text-xl font-bold">4 · <code>spec.md</code> <span class="badge badge-outline align-middle">rendered from the file</span></h2>
  <div class="card bg-base-200" data-block="threshold"><div class="card-body p-5 text-sm">Which threshold item this crosses, and why.</div></div>
  <article class="md card bg-base-200 p-6" data-md-target="spec.md"></article>
  <script type="text/markdown" data-md="spec.md"></script>
  <form class="card bg-base-200" data-lavish-question="spec" data-block="spec-approve" onsubmit="event.preventDefault(); q(this,'Spec')">
    <div class="card-body p-5 space-y-3">
      <div class="flex flex-wrap gap-4 text-sm">
        <label><input type="radio" name="choice" value="Spec approved" class="radio radio-sm" checked> Approve the spec</label>
        <label><input type="radio" name="choice" value="Spec needs changes (see note / annotations)" class="radio radio-sm"> Needs changes</label>
      </div>
      <textarea name="note" class="textarea textarea-bordered w-full text-sm" rows="2" placeholder="Optional note"></textarea>
      <div><button class="btn btn-primary btn-sm">Queue answer</button></div>
    </div>
  </form>
</section>
