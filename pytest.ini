[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Five opt-in markers, for five different reasons a test cannot gate a commit.
# `live` needs a real, focused game client. `system` mutates machine-global
# state. `lab` measures rather than gates: its assertions are either readings of
# the real world, which no amount of care makes independent of what else the
# machine is doing, or measurements of a known-open bug, which stay red until
# that bug is fixed. Either kind would wedge every unrelated change in the repo
# behind something it has nothing to do with. `client_files` needs the installed
# MapleStory Classic client's data on disk (`configs/game_data.ini`), which can't
# be committed and which the epic reviewer doesn't have. `frames` needs the real
# MSCW frame set, fetched with `python scripts/fetch_frames.py` from a private
# repository (frames can show other players' names, so they are never committed)
# which the epic reviewer can't read.
#
# Run them with `pytest -m live`, `-m system`, `-m lab`, `-m client_files` or
# `-m frames`,
# any of which overrides the deselection below. `-m lab` is how the measurements
# are read; nothing is silenced, it just stops gating.
addopts = -ra --strict-markers -m "not live and not system and not lab and not client_files and not frames"

markers =
    live: requires a running MapleStory client window; excluded from the default run.
    system: mutates machine-global state (loads and cycles keyboard layouts);
        excluded from the default run. Run them with `pytest -m system`.
    lab: measures rather than gates - a reading of real-world timing, or a
        measurement of a catalogued invariant that does not hold yet. Excluded
        from the default run; read them with `pytest -m lab`.
    client_files: reads the installed MapleStory Classic client's files, at the
        path configs/game_data.ini sets; excluded from the default run. Run
        them with `pytest -m client_files`. Never a running game.
    frames: reads the real MSCW frame set, fetched into data/frames/ by
        `python scripts/fetch_frames.py`; excluded from the default run. Run
        them with `pytest -m frames`. Skips when the frames aren't on disk.
