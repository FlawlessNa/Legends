[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `live` tests drive a real, focused game client, so they are opt-in: run them
# with `pytest -m live` (which overrides the deselection below).
addopts = -ra --strict-markers -m "not live"

markers =
    live: requires a running MapleStory client window; excluded from the default run.
