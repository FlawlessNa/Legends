[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `live` tests drive a real, focused game client and `system` tests mutate
# machine-global state, so both are opt-in: run them with `pytest -m live` or
# `pytest -m system`, either of which overrides the deselection below.
addopts = -ra --strict-markers -m "not live and not system"

markers =
    live: requires a running MapleStory client window; excluded from the default run.
    system: mutates machine-global state (loads and cycles keyboard layouts);
        excluded from the default run. Run them with `pytest -m system`.
